      tags: [Pets]
      operationId: createPet
      summary: Create a pet profile shared with selected Circles
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetInput' }
      responses:
        '201':
          description: Pet profile created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetOwnerDetail' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
  /pets/{petId}:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Pets]
      operationId: getPet
      summary: Read the caller's own pet profile and recovery settings
      description: Owner-only detail read. Circle members use GET /pets and receive only the shared PetProfile fields; private contact and recovery settings are not included there.
      responses:
        '200':
          description: Owner-visible profile settings; photoUrl, if present, is a short-lived signed Storage URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetOwnerDetail' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Pets]
      operationId: updatePet
      summary: Update the owner's pet profile and photo reference
      description: >-
        `photoObjectPath` must be the path returned by the short-lived upload URL for this pet, after the file upload succeeds. The server returns a short-lived signed `photoUrl`; clients do not send a member bearer token to Storage.
      requestBody: { $ref: '#/components/requestBodies/PetUpdate' }
      responses:
        '200':
          description: Updated pet profile; photoUrl, if present, is a signed Storage URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetOwnerDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Pets]
      operationId: deletePet
      summary: Delete a pet profile and its care records
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
