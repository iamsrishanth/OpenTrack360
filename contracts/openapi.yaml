x-openTrack360-policy:
  guest:
    linkFormat: 'https://track.srishanth.me/s/{shareId}#{secret}'
    secretBytes: 32
    pollingSeconds: 10
    maxDisplaySeconds: 30
    signalLostAfterSeconds: 90
    endedResponsesContainLocation: false
  destinationArrival:
    minimumFixCount: 2
    minimumSpanSeconds: 60
    radiusMeters: 150
  driveEnd:
    stationarySeconds: 300
    requiresConfirmedDrive: true
    gpsGapEndsShare: false
    parkedStartEndsShare: false
  requestLimits:
    locationSamplesPerBatch: 100
    eventEvidenceFixes: 10
    circleHistoryLimit: 1000
