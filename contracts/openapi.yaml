        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Coordination]
      operationId: setActivitySharing
      summary: Set the caller's activity-sharing consent
      requestBody: { $ref: '#/components/requestBodies/ActivitySharing' }
      responses:
        '200':
          description: Updated consent for the caller in this Circle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivitySharingResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/activity:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [Coordination]
      operationId: getCircleActivity
      summary: Read only consented activity state for Circle members
      responses:
        '200':
          description: Activity state for members who currently consent to share it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircleActivityList' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/morning-check-ins:
    parameters:
