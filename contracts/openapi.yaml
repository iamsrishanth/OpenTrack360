              schema: { $ref: '#/components/schemas/TripList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Coordination]
      operationId: startTrip
      summary: Start and share a trip with explicit Circle recipients and consent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TripStartRequest' }
      responses:
        '201':
          description: Trip started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/trips/{tripId}/stop:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Coordination]
      operationId: stopTrip
      summary: Stop the caller's active trip in this Circle
      description: Idempotent by clientRequestId. The server records its own endedAt timestamp; replay cannot reopen or extend a stopped trip.
      requestBody: { $ref: '#/components/requestBodies/TripStop' }
      responses:
        '200':
          description: Trip ended, including an idempotent replay of the terminal result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TripStopResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /circles/{circleId}/driving/reports:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [Safety]
      operationId: getDrivingReports
      summary: Read opt-in driving summaries measured from available phone data
      responses:
        '200':
          description: Caller-scoped driving reports for the Circle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrivingReportList' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/driving/trips/{tripId}:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
      - { name: tripId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Safety]
      operationId: correctDriveClassification
      summary: Let the trip owner correct driver/passenger classification
      description: Members may correct only their own drive. Reports recalculate from measurements the device actually collected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [classification]
              properties:
                classification: { type: string, enum: [driver, passenger] }
      responses:
        '200':
          description: Updated classification for the caller's trip
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrivingClassificationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /notifications:
    get:
      tags: [Coordination]
      operationId: listNotifications
      summary: List notifications for the caller
      parameters:
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: Notifications for the caller; delivery state reflects the underlying channel
