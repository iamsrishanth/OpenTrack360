              schema: { $ref: '#/components/schemas/CheckinList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Coordination]
      operationId: createCheckin
      summary: Create a one-time check-in for selected Circle recipients
      requestBody: { $ref: '#/components/requestBodies/CheckinCreate' }
      responses:
        '201':
          description: Check-in created for the addressed Circle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Checkin' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/quick-notes:
    parameters:
