      - { name: petId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Pets]
      operationId: listPetRoutines
      summary: List pet-care routines
      responses:
        '200':
          description: Routines the caller may see through the pet's shared Circles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetRoutineList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Pets]
      operationId: createPetRoutine
      summary: Create a pet-care routine or reminder
      requestBody: { $ref: '#/components/requestBodies/PetRoutineCreate' }
      responses:
        '201':
          description: Routine created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetRoutine' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pets/{petId}/activity:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Pets]
      operationId: listPetActivity
      summary: Read pet-care activity and routine completion history
      responses:
        '200':
          description: Routine completions visible through the pet's shared Circles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetActivityList' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pets/{petId}/photo:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Pets]
      operationId: createPetPhotoUpload
      summary: Request a short-lived upload URL for a private pet photo
      description: Uploaded objects remain in a private Storage bucket; reads are authorized per Circle membership and owner consent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contentType, sizeBytes]
              properties:
                contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
                sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
      responses:
        '201':
          description: Short-lived private upload authorization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetPhotoUploadResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pets/{petId}/recovery-link:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Pets]
      operationId: createPetRecoveryLink
      summary: Create or rotate a consent-limited software-only recovery QR link
      description: >-
        Returns the full link once in the form
        https://track.srishanth.me/p/{petId}#{secret}. Store only a digest of the
        256-bit random secret. The public ID is non-secret; the browser reads the
        fragment locally and sends the secret in Authorization.
      responses:
        '201':
          description: Secret-bearing recovery link, returned once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetRecoveryLinkResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Pets]
      operationId: revokePetRecoveryLink
      summary: Revoke the current recovery QR secret for this pet
      description: Invalidates every active recovery token for this pet; the pet profile remains private and can receive a newly rotated QR later.
      responses:
        '200':
          description: Current recovery link revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetRecoveryLinkRevocation' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pets/{petId}/routines/{routineId}/complete:
    parameters:
      - { name: petId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: routineId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Pets]
      operationId: completePetRoutine
      summary: Record a member's completion of a pet-care routine
      requestBody: { $ref: '#/components/requestBodies/PetRoutineCompletion' }
      responses:
        '201':
          description: Routine completion recorded, or duplicate-safe replay returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetRoutineCompletionResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /lost-pets:
    post:
      tags: [Pets]
      operationId: reportLostPet
      summary: Create a consent-based lost-pet report for the owner's selected audience
      description: No third-party search network is implied. The report is visible only to explicitly selected recipients and can be revoked by its owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostPetReportInput' }
      responses:
        '201':
          description: Lost-pet report created for the selected Circles
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostPetReport' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
  /public/pets/{petId}:
    parameters:
      - name: petId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Pets]
      operationId: readPetRecoveryCard
      security:
        - petRecoverySecret: []
      summary: Read the owner's consent-limited software-only pet recovery card
      description: No account or hardware tracker is required. The fragment secret grants access only to owner-approved public fields and never to Circle membership or private history. The token is not placed in the path, query, referrer, or initial request.
      responses:
        '200':
          description: Limited pet recovery details selected by the owner
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PetRecoveryCard' }
        '404':
          description: Unknown pet or invalid/missing recovery secret; no profile data
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
  /public/pets/{petId}/sightings:
    parameters:
      - name: petId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Pets]
      operationId: submitPetSighting
      security:
        - petRecoverySecret: []
      summary: Submit an optional finder sighting to the owner's selected recipients
      description: Sighting details are visible only to the pet owner and their selected recipients. The recovery secret is accepted in Authorization only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PetSightingRequest' }
      responses:
        '202':
          description: Sighting accepted for owner-selected recipients
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationResult' }
        '404':
          description: Unknown pet or invalid/missing recovery secret
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /guardian-consents:
    post:
      tags: [Privacy]
      operationId: requestGuardianConsent
      summary: Request guardian approval for a provisioned child member
      description: Only supports a verified, already-provisioned guardian account. Unsupported age or guardian verification flows stay unavailable until implemented and reviewed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GuardianConsentRequest' }
      responses:
        '201':
          description: Guardian consent request created for the authenticated member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GuardianConsentResult' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
  /guardian-consents/{consentId}/approve:
    parameters:
      - name: consentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Privacy]
      operationId: approveGuardianConsent
      summary: Record approval by the designated authenticated guardian
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /privacy/export:
    post:
      tags: [Privacy]
      operationId: requestDataExport
      summary: Request the caller's data export
      responses:
        '202': { $ref: '#/components/responses/MutationResult' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
  /privacy/deletion:
    post:
      tags: [Privacy]
      operationId: requestAccountDeletion
      summary: Request account and personal-data deletion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrivacyDeletionRequest' }
      responses:
        '202':
          description: Deletion request accepted for the authenticated account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrivacyDeletionAccepted' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
  /admin/accounts:
    get:
      tags: [Platform Admin]
      operationId: listManagedAccounts
      security: [{ adminSession: [] }]
      summary: List provisioned accounts for account administration only
      responses:
        '200':
          description: Provisioned accounts visible to the platform administrator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAccountList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Platform Admin]
      operationId: provisionAccount
      security: [{ adminSession: [] }]
      summary: Provision a member and display a generated temporary password once
      parameters: [{ $ref: '#/components/parameters/AdminCsrfToken' }]
      requestBody: { $ref: '#/components/requestBodies/AdminProvisionAccount' }
      responses:
        '201':
          description: Provisioned account and one-time temporary password; do not log or persist the password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProvisionAccountResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /lost-pets/{reportId}:
    parameters:
      - { name: reportId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Pets]
      operationId: revokeLostPetReport
      summary: Revoke the caller's active lost-pet report
      description: Owner-only and idempotent; after revocation the report is no longer visible to recipient Circles.
      responses:
        '200':
          description: Report revoked or already revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostPetReportRevocation' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/accounts/{accountId}/reset:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Platform Admin]
      operationId: resetMemberPassword
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/AdminCsrfToken' }]
      summary: Perform an auditable admin-assisted password reset and stop sharing
      description: >-
        Immediately revokes member sessions, advances the sharing epoch, disables Circle location and activity sharing, ends all guest links and active trips, and clears the latest location. These privacy actions remain in effect if password reset fails. After sign-in and temporary-password rotation, the member must explicitly re-enable any sharing.
      responses:
        '200':
          description: One-time temporary password and the reset/revocation result; do not log or persist the password.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPasswordResetResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/accounts/{accountId}/disable:
    parameters:
      - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Platform Admin]
      operationId: disableMemberAccount
      security: [{ adminSession: [] }]
      parameters: [{ $ref: '#/components/parameters/AdminCsrfToken' }]
      summary: Disable a member and invalidate API and database access
      responses:
        '200':
          description: Account and sharing state disabled; Auth provider ban result is reported.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDisableAccountResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audit:
    get:
      tags: [Platform Admin]
      operationId: listAccountAuditEvents
      security: [{ adminSession: [] }]
      summary: List account-management audit events without location history
      responses:
        '200':
          description: Account-administration events only; no location or map data.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditList' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/bootstrap:
    post:
      tags: [Platform Admin]
      operationId: bootstrapFirstAdmin
      security: [{ adminBootstrapSecret: [] }]
      summary: Claim and create the first platform administrator exactly once
      description: Operator-only recovery path enabled by a server-side bootstrap secret. Public sign-up remains disabled; no default account or credentials exist. Remove the configured secret after successful bootstrap.
      requestBody: { $ref: '#/components/requestBodies/AdminBootstrap' }
      responses:
        '201':
          description: First administrator created; the one-time temporary password requires rotation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBootstrapResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    memberBearer:
      type: http
      scheme: bearer
      bearerFormat: Supabase JWT
      description: Member access token. Username is the visible identity; internal Auth email is never exposed.
    shareSecret:
      type: http
      scheme: bearer
      bearerFormat: base64url random secret
      description: Per-share 256-bit secret, accepted only for GET /public/shares/{shareId}.
    petRecoverySecret:
      type: http
      scheme: bearer
      bearerFormat: base64url random secret
      description: Per-pet 256-bit secret from the fragment; accepted only for public recovery card and sighting endpoints.
    adminSession:
      type: apiKey
      in: cookie
      name: __Host-ot360-admin
      description: Secure, HTTP-only, SameSite=Strict server-validated website administrator session; mutations require CSRF protection.
    adminBootstrapSecret:
      type: http
      scheme: bearer
      bearerFormat: one-time operator secret
      description: Server-side operator-only bootstrap secret; never send it from the public website or mobile app.
  parameters:
    ShareId:
      name: shareId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CircleId:
      name: circleId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberId:
      name: memberId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminCsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Must match the readable SameSite=Strict CSRF cookie issued to the same-origin administrator browser session.
      schema: { type: string, minLength: 32, maxLength: 256 }
  requestBodies:
    CircleInviteCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CircleInviteCreateRequest' }
    CircleInviteAccept:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CircleInviteAcceptRequest' }
    AdminProvisionAccount:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminProvisionAccountRequest' }
    AdminBootstrap:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminBootstrapRequest' }
    CircleUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CircleUpdateRequest' }
    PlaceUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlaceUpdateRequest' }
    CircleMemberUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CircleMemberUpdateRequest' }
    PetUpdate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PetUpdateRequest' }
    AcknowledgeNotifications:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AcknowledgeNotificationsRequest' }
    CheckinCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CheckinCreateRequest' }
    QuickNoteCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/QuickNoteCreateRequest' }
    EventCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EventCreateRequest' }
    EventRsvp:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EventRsvpRequest' }
    ActivitySharing:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ActivitySharingRequest' }
    MorningCheckinCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MorningCheckinCreateRequest' }
    BubbleCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BubbleCreateRequest' }
    EmergencyContactInvite:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmergencyContactInviteRequest' }
    PetRoutineCreate:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PetRoutineCreateRequest' }
    PetRoutineCompletion:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PetRoutineCompletionRequest' }
    TripStop:
      required: true
      content:
        application/json:
          schema: { $ref: '#/components/schemas/TripStopRequest' }
  responses:
    GenericUnauthorized:
      description: Missing, invalid, disabled, expired, or revoked credentials; generic response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { error: { code: UNAUTHORIZED, message: Unable to authenticate } }
    InvalidRequest:
      description: Invalid input or policy violation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ServiceUnavailable:
      description: Authentication service is temporarily unavailable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    PasswordRotationRequired:
      description: Temporary password must be rotated before member data access
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { error: { code: PASSWORD_ROTATION_REQUIRED, message: Change your password to continue } }
    RateLimited:
      description: Request throttled; Retry-After is provided where practical
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Forbidden:
      description: Caller does not have access to this Circle or resource
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    NotFound:
      description: Resource not found or not visible to this caller
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    Conflict:
      description: Unique username or idempotency conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    ShareEnded:
      description: Share has ended; response contains no location
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
    MutationResult:
      description: Mutation accepted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MutationResult' }
  schemas:
    CircleInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        kind: { type: string, enum: [standard, temporary, lightweight], default: standard }
        expiresAt: { type: [string, 'null'], format: date-time, description: Required for temporary Circles; maximum duration is enforced by the server. }
    CircleSummary:
      type: object
      additionalProperties: false
      required: [id, name, kind, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind: { type: string, enum: [standard, temporary, lightweight] }
        role: { type: string, enum: [admin, member] }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
    CircleUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    CircleInviteSummary:
      type: object
      additionalProperties: false
      required: [id, role, expiresAt, maxUses, uses, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [admin, member] }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer, minimum: 1, maximum: 100 }
        uses: { type: integer, minimum: 0, maximum: 100 }
        createdAt: { type: string, format: date-time }
    CircleInviteList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CircleInviteSummary' } }
        nextCursor: { type: [string, 'null'] }
    CircleInviteAcceptResult:
      type: object
      additionalProperties: false
      required: [joined, circleId, role]
      properties:
        joined: { type: boolean, const: true }
        circleId: { type: string, format: uuid }
        role: { type: string, enum: [admin, member] }
    CircleMember:
      type: object
      additionalProperties: false
      required: [memberId, username, displayName, role, sharingEnabled, activitySharingEnabled, precision, joinedAt]
      properties:
        memberId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, member] }
        sharingEnabled: { type: boolean }
        activitySharingEnabled: { type: boolean }
        precision: { type: string, enum: [precise, approximate, hidden] }
        joinedAt: { type: string, format: date-time }
    CircleMemberList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CircleMember' } }
        nextCursor: { type: [string, 'null'] }
    CircleInviteCreateRequest:
      type: object
      additionalProperties: false
      required: [clientRequestId]
      properties:
        clientRequestId: { type: string, format: uuid, description: Retry key. A replay conflicts because the clear token is returned only once. }
        role: { type: string, enum: [admin, member], default: member }
        expiresAt: { type: [string, 'null'], format: date-time, description: Defaults to 72 hours from creation; maximum is 72 hours. }
        maxUses: { type: integer, minimum: 1, maximum: 100, default: 1 }
    CircleInviteCreated:
      type: object
      additionalProperties: false
      required: [id, circleId, url, role, expiresAt, maxUses, createdAt]
      properties:
        id: { type: string, format: uuid }
        circleId: { type: string, format: uuid }
        url: { type: string, format: uri, description: 'One-time https://track.srishanth.me/i#{inviteToken} link; the secret is only in the fragment and only its digest is stored.' }
        role: { type: string, enum: [admin, member] }
        expiresAt: { type: string, format: date-time }
        maxUses: { type: integer, minimum: 1, maximum: 100 }
        createdAt: { type: string, format: date-time }
    CircleInviteAcceptRequest:
      type: object
      additionalProperties: false
      required: [inviteToken]
      properties:
        inviteToken: { type: string, minLength: 32, description: Opaque token read from the URL fragment and sent in the POST body only. }
    CircleMemberUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        role: { type: string, enum: [admin, member], description: Circle admins may change the role of another member. }
        precision: { type: string, enum: [precise, approximate, hidden], description: Members may change their own location precision; Circle admins cannot override it. }
    CircleMemberUpdateResult:
      type: object
      additionalProperties: false
      required: [circleId, memberId, role, precision, updatedAt]
      properties:
        circleId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        role: { type: string, enum: [admin, member] }
        precision: { type: string, enum: [precise, approximate, hidden] }
        updatedAt: { type: string, format: date-time }
    CircleList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/CircleSummary' } }
        nextCursor: { type: [string, 'null'] }
    CircleMap:
      type: object
      additionalProperties: false
      required: [data, serverTime]
      properties:
        serverTime: { type: string, format: date-time }
        data: { type: array, items: { $ref: '#/components/schemas/CircleMapMember' } }
    CircleMapMember:
      type: object
      additionalProperties: false
      required: [memberId, displayName, sharingState, location]
      properties:
        memberId: { type: string, format: uuid }
        displayName: { type: string }
        sharingState: { type: string, enum: [sharing, paused, signal_lost, hidden] }
        location:
          oneOf:
            - { $ref: '#/components/schemas/CircleLocation' }
            - { type: 'null' }
        batteryPercent: { type: [integer, 'null'], minimum: 0, maximum: 100 }
        activity: { type: [string, 'null'], enum: [walking, driving, stationary, unknown, null] }
    CircleLocation:
      type: object
      additionalProperties: false
      required: [latitude, longitude, accuracyMeters, capturedAt, precision]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyMeters: { type: number, minimum: 0 }
        capturedAt: { type: string, format: date-time }
        precision: { type: string, enum: [precise, bubble_approximate] }
    LocationHistory:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [sampleId, latitude, longitude, accuracyMeters, capturedAt]
            properties:
              sampleId: { type: string, format: uuid }
              latitude: { type: number, minimum: -90, maximum: 90 }
              longitude: { type: number, minimum: -180, maximum: 180 }
              accuracyMeters: { type: number, minimum: 0 }
              capturedAt: { type: string, format: date-time }
              speedMps: { type: [number, 'null'], minimum: 0 }
              precision: { type: string, enum: [precise, bubble_approximate] }
        nextCursor: { type: [string, 'null'] }
    PlaceInput:
      type: object
      additionalProperties: false
      required: [name, latitude, longitude, radiusMeters]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radiusMeters: { type: integer, minimum: 50, maximum: 5000 }
        alertOnArrival: { type: boolean, default: false }
        alertOnDeparture: { type: boolean, default: false }
    Place:
      type: object
      additionalProperties: false
      required: [id, circleId, name, latitude, longitude, radiusMeters, alertOnArrival, alertOnDeparture, createdAt]
      properties:
        id: { type: string, format: uuid }
        circleId: { type: string, format: uuid }
        name: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radiusMeters: { type: integer, minimum: 50, maximum: 5000 }
        alertOnArrival: { type: boolean }
        alertOnDeparture: { type: boolean }
        createdAt: { type: string, format: date-time }
    PlaceUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        radiusMeters: { type: integer, minimum: 50, maximum: 5000 }
        alertOnArrival: { type: boolean }
        alertOnDeparture: { type: boolean }
    PlaceList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Place' } }
        nextCursor: { type: [string, 'null'] }
    TripStartRequest:
      type: object
      additionalProperties: false
      required: [recipientMemberIds]
      properties:
        recipientMemberIds: { type: array, minItems: 1, items: { type: string, format: uuid } }
        destinationLabel: { type: [string, 'null'], maxLength: 120 }
        destinationLatitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
        destinationLongitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
        shareLockScreenProgress: { type: boolean, default: false }
        confirmedDrive: { type: boolean, default: false, description: Explicit member confirmation; never inferred from speed alone. }
    TripSummary:
      type: object
      additionalProperties: false
      required: [id, status, startedAt, confirmedDrive]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [active, ended] }
        startedAt: { type: string, format: date-time }
        confirmedDrive: { type: boolean, description: The caller's explicit driver confirmation stored by the server; false when omitted at trip start. }
        endedAt: { type: [string, 'null'], format: date-time }
        endReason: { type: [string, 'null'], enum: [arrived, cancelled, other, server_confirmed, null] }
        estimatedArrivalAt: { type: [string, 'null'], format: date-time }
        distanceRemainingMeters: { type: [number, 'null'], minimum: 0 }
        destinationLabel: { type: [string, 'null'] }
    TripList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/TripSummary' } }
        nextCursor: { type: [string, 'null'] }
    DrivingReport:
      type: object
      additionalProperties: false
      required: [tripId, memberId, startedAt, endedAt, classification, confirmedDrive]
      properties:
        tripId: { type: string, format: uuid }
        memberId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        classification: { type: string, enum: [driver, passenger] }
        confirmedDrive: { type: boolean }
    DrivingReportList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/DrivingReport' } }
        nextCursor: { type: [string, 'null'] }
    DrivingClassificationResult:
      type: object
      additionalProperties: false
      required: [tripId, classification, updatedAt]
      properties:
        tripId: { type: string, format: uuid }
        classification: { type: string, enum: [driver, passenger] }
        updatedAt: { type: string, format: date-time }
    NotificationList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        nextCursor: { type: [string, 'null'] }
    Notification:
      type: object
      additionalProperties: false
      required: [id, kind, circleId, sosId, createdAt, deliveryState]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [place_arrival, place_departure, no_show, quick_note, checkin, event, sos, low_battery, trip_progress, pet_routine] }
        circleId: { type: [string, 'null'], format: uuid, description: Authenticated Circle route context when the notification came from a Circle. }
        sosId: { type: [string, 'null'], format: uuid, description: 'For kind sos, use with circleId to read or acknowledge that alert through authenticated Circle SOS routes.' }
        createdAt: { type: string, format: date-time }
        deliveryState: { type: string, enum: [queued, submitted, received, acknowledged, failed] }
        title: { type: string, maxLength: 120 }
        body: { type: string, maxLength: 500 }
        acknowledgedAt: { type: [string, 'null'], format: date-time }
    AcknowledgeNotificationsRequest:
      type: object
      additionalProperties: false
      required: [notificationIds]
      properties:
        notificationIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    AcknowledgeNotificationsResult:
      type: object
      additionalProperties: false
      required: [acknowledgedCount, acknowledgedAt]
      properties:
        acknowledgedCount: { type: integer, minimum: 0, maximum: 100 }
        acknowledgedAt: { type: string, format: date-time }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32, description: Case-insensitive normalized identifier. }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 20, maxLength: 4096, writeOnly: true }
        clientId: { type: string, minLength: 1, maxLength: 128, description: Required for a Supabase OAuth session. Omit for a username/password session. }
    OAuthCodeExchangeRequest:
      type: object
      additionalProperties: false
      required: [code, codeVerifier]
      properties:
        code: { type: string, minLength: 1, maxLength: 4096, writeOnly: true, description: Single-use code from the registered HTTPS callback. Never log or persist it. }
        codeVerifier: { type: string, minLength: 43, maxLength: 128, pattern: '^[A-Za-z0-9._~-]+$', writeOnly: true, description: PKCE verifier generated by the Android app; transmit only over HTTPS and discard after exchange. }
    OAuthClientConfiguration:
      type: object
      additionalProperties: false
      required: [issuer, authorizationEndpoint, tokenExchangeEndpoint, refreshEndpoint, clientId, redirectUri, responseType, codeChallengeMethod, scopes]
      properties:
        issuer: { type: string, format: uri }
        authorizationEndpoint: { type: string, format: uri }
        tokenExchangeEndpoint: { type: string, format: uri, description: OpenTrack360 endpoint that validates and registers the OAuth session. }
        refreshEndpoint: { type: string, format: uri, description: OpenTrack360 endpoint; send refreshToken and clientId. }
        clientId: { type: string, minLength: 1, maxLength: 128, description: Public client identifier; it is not a secret. }
        redirectUri: { type: string, const: 'https://track.srishanth.me/oauth/callback' }
        responseType: { type: string, const: code }
        codeChallengeMethod: { type: string, const: S256 }
        scopes: { type: array, items: { type: string, enum: [openid] }, minItems: 1, maxItems: 1 }
    MemberSession:
      type: object
      additionalProperties: false
      required: [accessToken, refreshToken, tokenType, expiresInSeconds, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, const: Bearer }
        expiresInSeconds: { type: integer, minimum: 1 }
        user:
          type: object
          required: [id, username, mustRotatePassword]
          properties:
            id: { type: string, format: uuid }
            username: { type: string }
            mustRotatePassword: { type: boolean }
    MemberProfile:
      type: object
      required: [id, username, mustRotatePassword, sharingEpoch]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: [string, 'null'] }
        mustRotatePassword: { type: boolean }
        sharingEpoch: { type: integer, minimum: 1, description: Account-wide epoch for location uploads; starts at 1 and advances atomically on stop-sharing or password reset. }
    AdminPasswordResetResult:
      type: object
      additionalProperties: false
      required: [accountId, username, temporaryPassword, mustRotatePassword, sessionsRevoked, sharingStopped, sharingEpoch]
      properties:
        accountId: { type: string, format: uuid }
        username: { type: string }
        temporaryPassword: { type: string, readOnly: true, description: One-time display only; never store or log. }
        mustRotatePassword: { type: boolean, const: true }
        sessionsRevoked: { type: boolean, const: true }
        sharingStopped: { type: boolean, const: true }
        sharingEpoch: { type: integer, minimum: 1 }
    AdminProvisionAccountRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username: { type: string, minLength: 3, maxLength: 32, description: Case-insensitive; normalized by the server. }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        requestId: { type: string, format: uuid, description: Optional unique request identifier. Reusing an ID returns a conflict; after an ambiguous result inspect the account list and use password reset if the account was created. }
    AdminProvisionAccountResult:
      type: object
      additionalProperties: false
      required: [accountId, username, displayName, status, mustRotatePassword, temporaryPassword, requestId]
      properties:
        accountId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        status: { type: string, const: active }
        mustRotatePassword: { type: boolean, const: true }
        temporaryPassword: { type: string, readOnly: true, description: One-time display only; never store or log. }
        requestId: { type: string, format: uuid }
    AdminAccountSummary:
      type: object
      additionalProperties: false
      required: [accountId, username, displayName, status, mustRotatePassword, createdAt]
      properties:
        accountId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [provisioning, active, disabled, deleting] }
        mustRotatePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
    AdminAccountList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AdminAccountSummary' } }
        nextCursor: { type: [string, 'null'], format: uuid }
    AdminDisableAccountResult:
      type: object
      additionalProperties: false
      required: [disabled, authProviderBanApplied]
      properties:
        disabled: { type: boolean, const: true }
        alreadyDisabled: { type: boolean }
        sessionsRevoked: { type: boolean, const: true }
        sharingStopped: { type: boolean, const: true }
        authProviderBanApplied: { type: boolean }
    AdminAuditEvent:
      type: object
      additionalProperties: false
      required: [id, actorUsername, targetAccountId, eventType, metadata, createdAt]
      properties:
        id: { type: integer, minimum: 1 }
        actorUsername: { type: [string, 'null'] }
        targetAccountId: { type: [string, 'null'], format: uuid }
        eventType: { type: string }
        metadata: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    AdminAuditList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/AdminAuditEvent' } }
        nextCursor: { type: [string, 'null'], pattern: '^\\d+$' }
    AdminBootstrapRequest:
      type: object
      additionalProperties: false
      required: [username, temporaryPassword]
      properties:
        username: { type: string, minLength: 3, maxLength: 32, description: Case-insensitive; normalized by the server. }
        displayName: { type: string, minLength: 1, maxLength: 80 }
        temporaryPassword: { type: string, minLength: 16, maxLength: 128, writeOnly: true }
    AdminBootstrapResult:
      type: object
      additionalProperties: false
      required: [accountId, username, temporaryPassword, mustRotatePassword]
      properties:
        accountId: { type: string, format: uuid }
        username: { type: string }
        temporaryPassword: { type: string, readOnly: true, description: One-time display only; must be rotated on first sign-in. }
        mustRotatePassword: { type: boolean, const: true }
    LocationSample:
      type: object
      additionalProperties: false
      required: [sampleId, capturedAt, latitude, longitude, accuracyMeters, speedMps]
      properties:
        sampleId: { type: string, format: uuid }
        capturedAt: { type: string, format: date-time }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyMeters: { type: number, minimum: 0, maximum: 10000 }
        speedMps: { type: [number, 'null'], minimum: 0, maximum: 150 }
    LocationBatchRequest:
      type: object
      additionalProperties: false
      required: [sharingEpoch, samples]
      properties:
        sharingEpoch: { type: integer, minimum: 1, description: Must match the current value returned by GET /me. A mismatch rejects the entire batch. }
        samples:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/LocationSample' }
    LocationBatchResult:
      type: object
      required: [serverTime, accepted, duplicates, rejected]
      properties:
        serverTime: { type: string, format: date-time }
        accepted: { type: array, items: { type: string, format: uuid } }
        duplicates: { type: array, items: { type: string, format: uuid } }
        rejected:
          type: array
          items:
            type: object
            required: [sampleId, code]
            properties:
              sampleId: { type: string, format: uuid }
              code: { type: string, enum: [out_of_order, too_old, future_timestamp, poor_accuracy, invalid_coordinate, after_share_end, account_disabled] }
    CreateShareRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, expiresAt]
          properties:
            mode: { type: string, const: time }
            expiresAt: { type: string, format: date-time }
        - type: object
          additionalProperties: false
          required: [mode, destination]
          properties:
            mode: { type: string, const: destination }
            destination:
              type: object
              additionalProperties: false
              required: [latitude, longitude, radiusMeters]
              properties:
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
                radiusMeters: { type: integer, minimum: 50, maximum: 1000, default: 150 }
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode: { type: string, const: drive_end }
            confirmedDrive: { type: boolean, default: false, description: Explicit confirmation; never inferred from speed alone. }
    CreatedShare:
      type: object
      additionalProperties: false
      required: [id, url, mode, status, startedAt, createdAt, tripId, tripStartedAt, tripSessionMatchesCurrent, sharingEpoch]
      properties:
        id: { type: string, format: uuid }
        url: { type: string, format: uri, description: The only response that contains the secret. }
        mode: { type: string, enum: [time, destination, drive_end] }
        status: { type: string, const: active }
        startedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        endCondition: { type: string, description: Human-readable terminal condition; drive_end states the five continuous minutes of credible stationary evidence required after confirmed driving. }
        tripId: { type: [string, 'null'], format: uuid, description: Sender-only identifier of the exact trip linked to a drive_end share; null for other modes. }
        tripStartedAt: { type: [string, 'null'], format: date-time, description: Sender-only start time of the exact confirmed trip linked to a drive_end share; null for other modes. }
        tripSessionMatchesCurrent: { type: [boolean, 'null'], description: Sender-only signal that the linked trip is still active and its original session and sharing epoch match this authenticated session; null for other modes. }
        sharingEpoch: { type: integer, minimum: 1, description: Account sharing epoch stored on this share; compare against GET /me before resuming local evidence. }
    ShareEventRequest:
      type: object
      additionalProperties: false
      required: [clientEventId, eventType, observedAt, evidenceFixes]
      properties:
        clientEventId: { type: string, format: uuid }
        eventType: { type: string, enum: [arrival, drive_end] }
        observedAt: { type: string, format: date-time }
        evidenceFixes:
          type: array
          minItems: 1
          maxItems: 10
          description: Destination samples must be post-share-start. Drive-end samples must match the linked trip session and epoch; moving samples may predate share creation, but stationary samples must be post-share-start.
          items: { $ref: '#/components/schemas/LocationSample' }
    ShareEventResult:
      type: object
      additionalProperties: false
      required: [clientEventId, status, serverTime]
      properties:
        clientEventId: { type: string, format: uuid }
        status: { type: string, enum: [confirmed, pending, duplicate] }
        serverTime: { type: string, format: date-time }
        endedAt: { type: [string, 'null'], format: date-time }
        reason: { type: [string, 'null'], enum: [arrival_confirmed, drive_end_confirmed, insufficient_evidence, stale_evidence, poor_accuracy, event_already_ended, null] }
    PublicShare:
      type: object
      additionalProperties: false
      required: [status, serverTime, viewValidUntil, latest]
      properties:
        status: { type: string, enum: [waiting, active, signal_lost] }
        serverTime: { type: string, format: date-time }
        viewValidUntil: { type: string, format: date-time }
        latest:
          oneOf:
            - { $ref: '#/components/schemas/PublicFix' }
            - { type: 'null' }
    ShareList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, mode, status, createdAt, startedAt, expiresAt, destination, tripId, tripStartedAt, tripSessionMatchesCurrent, sharingEpoch]
            properties:
              id: { type: string, format: uuid }
              mode: { type: string, enum: [time, destination, drive_end] }
              status: { type: string, enum: [active, ended] }
              createdAt: { type: string, format: date-time }
              startedAt: { type: string, format: date-time }
              expiresAt: { type: [string, 'null'], format: date-time }
              endedAt: { type: [string, 'null'], format: date-time }
              tripId: { type: [string, 'null'], format: uuid, description: Sender-only identifier of the exact trip linked to a drive_end share; null for other modes. }
              tripStartedAt: { type: [string, 'null'], format: date-time, description: Sender-only start time of the exact linked drive_end trip; null for other modes. }
              tripSessionMatchesCurrent: { type: [boolean, 'null'], description: True only when the linked trip is still active and its original authenticated session and sharing epoch still match this caller; null for other modes. }
              sharingEpoch: { type: integer, minimum: 1, description: Epoch stored on this share; compare with GET /me before resuming local evidence. }
              destination:
                oneOf:
                  - type: object
                    additionalProperties: false
                    required: [latitude, longitude, radiusMeters]
                    properties:
                      latitude: { type: number, minimum: -90, maximum: 90 }
                      longitude: { type: number, minimum: -180, maximum: 180 }
                      radiusMeters: { type: integer, minimum: 50, maximum: 1000 }
                  - type: 'null'
              endCondition: { type: string, description: Human-readable terminal condition; drive_end states the five continuous minutes of credible stationary evidence required after confirmed driving. }
        nextCursor: { type: [string, 'null'] }
      description: Sender-only response. Destination data lets the owner resume local arrival monitoring after restart. For drive_end, tripId and tripStartedAt identify the exact linked trip; tripSessionMatchesCurrent and sharingEpoch let the owner decide whether local evidence can resume. Moving evidence may predate share creation only when tripSessionMatchesCurrent is true and the sample is at or after tripStartedAt. Stationary evidence and destination evidence remain post-share-start. These fields are never returned to the guest. No field contains the share secret, its digest, or a complete share URL.
    PublicFix:
      type: object
      additionalProperties: false
      required: [latitude, longitude, accuracyMeters, capturedAt, speedMps]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracyMeters: { type: number, minimum: 0 }
        capturedAt: { type: string, format: date-time }
        speedMps: { type: [number, 'null'], minimum: 0 }
    PlaceRuleInput:
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind: { type: string, enum: [arrival, departure, no_show] }
        memberIds:
          type: array
          items: { type: string, format: uuid }
          description: Empty means all consenting members of this Circle.
        expectedAt: { type: [string, 'null'], format: date-time }
        graceMinutes: { type: integer, minimum: 0, maximum: 1440, default: 15 }
        recurrence:
          oneOf:
            - { type: object, additionalProperties: false, required: [frequency, interval], properties: { frequency: { type: string, enum: [daily, weekly] }, interval: { type: integer, minimum: 1, maximum: 52 }, weekdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }, localTime: { type: string, pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$' }, timeZone: { type: string } } }
            - { type: 'null' }
    PlaceRule:
      type: object
      additionalProperties: false
      required: [id, circleId, placeId, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        circleId: { type: string, format: uuid }
        placeId: { type: string, format: uuid }
        kind: { type: string, enum: [arrival, departure, no_show] }
        memberIds: { type: array, items: { type: string, format: uuid } }
        expectedAt: { type: [string, 'null'], format: date-time }
        graceMinutes: { type: integer, minimum: 0, maximum: 1440 }
        recurrence:
          oneOf:
            - { type: object, additionalProperties: false, required: [frequency, interval], properties: { frequency: { type: string, enum: [daily, weekly] }, interval: { type: integer, minimum: 1, maximum: 52 }, weekdays: { type: array, items: { type: integer, minimum: 1, maximum: 7 } }, localTime: { type: string, pattern: '^([01]?[0-9]|2[0-3]):[0-5][0-9]$' }, timeZone: { type: string } } }
            - { type: 'null' }
        createdAt: { type: string, format: date-time }
    PlaceRuleList:
      type: object
      additionalProperties: false
      required: [data, nextCursor]
      properties:
        data: { type: array, items: { $ref: '#/components/schemas/PlaceRule' } }
        nextCursor: { type: [string, 'null'] }
    SosRequest:
      type: object
      additionalProperties: false
      required: [clientEventId, cancelCountdownSeconds]
      properties:
        clientEventId: { type: string, format: uuid }
        cancelCountdownSeconds: { type: integer, minimum: 0, maximum: 30, default: 5 }
        latitude: { type: [number, 'null'], minimum: -90, maximum: 90 }
        longitude: { type: [number, 'null'], minimum: -180, maximum: 180 }
        accuracyMeters: { type: [number, 'null'], minimum: 0, maximum: 10000 }
      oneOf:
        - not:
            anyOf:
              - required: [latitude]
