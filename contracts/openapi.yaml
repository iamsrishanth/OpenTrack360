    put:
      tags: [Coordination]
      operationId: updateEventRsvp
      summary: Set or replace the caller's RSVP
      requestBody: { $ref: '#/components/requestBodies/EventRsvp' }
      responses:
        '200':
          description: The caller's RSVP state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EventRsvpResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/activity-sharing:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [Coordination]
      operationId: getActivitySharing
