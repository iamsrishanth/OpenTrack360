        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Safety]
      operationId: acceptEmergencyContactInvite
      summary: Accept the caller's pending emergency-contact invitation
      description: The authenticated account must be the invitee. The invitation ID is not a bearer secret.
      responses:
        '200':
          description: Invitation accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmergencyContactAcceptResult' }
        '404': { $ref: '#/components/responses/NotFound' }
  /circles/{circleId}/sos:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    post:
      tags: [Safety]
      operationId: createSosAlert
      summary: Send an in-app SOS to configured recipients in this Circle
      description: Does not contact or imply dispatch of public emergency services. Delivery state reflects the configured channel only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SosRequest' }
            example:
              clientEventId: c1cb7118-2257-4e5f-92d1-74f1a44ae2c0
              cancelCountdownSeconds: 5
              latitude: 19.076
              longitude: 72.8777
              accuracyMeters: 12.5
      responses:
        '202':
          description: Alert queued for configured in-app recipients
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SosResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/sos/{sosId}:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
      - { name: sosId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Safety]
      operationId: getSosAlert
      summary: Read delivery state for an SOS the caller may access
      responses:
        '200':
          description: Per-recipient in-app delivery and acknowledgement states
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SosResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /circles/{circleId}/sos/{sosId}/cancel:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
      - { name: sosId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
