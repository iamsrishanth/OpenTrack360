              schema: { $ref: '#/components/schemas/MorningCheckinList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Coordination]
      operationId: createMorningCheckIn
      summary: Send a morning greeting or check-in to this Circle
      requestBody: { $ref: '#/components/requestBodies/MorningCheckinCreate' }
      responses:
        '201':
          description: Morning check-in created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MorningCheckin' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/trips:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [Coordination]
      operationId: listTrips
      summary: List the caller's or authorized Circle members' trip progress
      responses:
        '200':
          description: Trips accessible to this Circle and caller
          content:
