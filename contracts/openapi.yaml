            application/json:
              schema: { $ref: '#/components/schemas/EmergencyContactList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Safety]
      operationId: inviteEmergencyContact
      summary: Invite an emergency contact for explicit acceptance
      requestBody: { $ref: '#/components/requestBodies/EmergencyContactInvite' }
      responses:
        '201':
          description: Invitation created for the named provisioned member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmergencyContactInviteResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /emergency-contact-invites/{inviteId}/accept:
    parameters:
      - name: inviteId
