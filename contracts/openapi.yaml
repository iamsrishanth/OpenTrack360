      responses:
        '200':
          description: Count of caller-owned notifications acknowledged by this request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcknowledgeNotificationsResult' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
