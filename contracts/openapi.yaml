openapi: 3.1.0
info:
  title: OpenTrack360 API
  version: 1.0.0
  license:
    name: Proprietary
    identifier: LicenseRef-OpenTrack360
  description: >-
    Versioned Android and web API. API timestamps are RFC 3339 UTC; latitude and
    longitude are decimal degrees, horizontal accuracy is metres, and speed is
    metres per second. Authenticated member endpoints derive the member from
    their validated session. A guest share secret is sent only in the Authorization
    header; it must never be included in a query string or initial page request.
servers:
  - url: https://track.srishanth.me/api/v1
    description: Production API
tags:
  - name: Auth
    description: Username-based member authentication and session lifecycle.
  - name: Member
    description: Caller-owned profile and privacy controls.
  - name: Location
    description: Authenticated, bounded location ingest.
  - name: Shares
    description: Sender-owned guest link creation and revocation.
  - name: Guest
    description: Read-only, single-share access for signed-out recipients.
  - name: Circles
    description: Private Circle membership, consent, maps, and history.
  - name: Places
    description: Circle Places, geofences, and No Show rules.
  - name: Coordination
    description: Check-ins, events, activity, trips, and notifications.
  - name: Safety
    description: Measured driving reports, SOS, and emergency contacts.
  - name: Pets
    description: Pet profiles, care routines, and consent-limited recovery.
  - name: Privacy
    description: Data access, deletion, and guardian-consent workflows.
  - name: Platform Admin
    description: Account administration only; no map or history access.
security:
  - memberBearer: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      summary: Sign in with a provisioned username and password
      description: Public account creation is disabled. Errors do not distinguish unknown, disabled, or incorrect credentials. Rate limited by username and client address.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              firstLogin:
                value: { username: aarav, password: Temp-Pass-7vNQ! }
      responses:
        '200':
          description: Authenticated session; data access remains blocked when password rotation is required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSession' }
              examples:
                rotationRequired:
                  value:
                    accessToken: synthetic-access-token
                    refreshToken: synthetic-refresh-token
                    tokenType: Bearer
                    expiresInSeconds: 3600
                    user: { id: 1bcb3a8e-0d22-4b0a-a910-510fd4547f61, username: aarav, mustRotatePassword: true }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      summary: Refresh a password or OAuth member session
      description: A Supabase OAuth session supplies its registered public clientId so the server uses the OAuth token endpoint and preserves the session epoch checks. Password sessions omit clientId.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshSessionRequest' }
            examples:
              passwordSession:
                value: { refreshToken: fixture-refresh-token-do-not-use }
              oauthSession:
                value: { refreshToken: fixture-oauth-refresh-token-do-not-use, clientId: fixture-public-client-id }
      responses:
        '200':
          description: Rotated session tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSession' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
  /auth/oauth-config:
    get:
      tags: [Auth]
      operationId: getOAuthClientConfiguration
      security: []
      summary: Read public Android OAuth client configuration
      description: Returns non-secret authorization settings for the registered public PKCE app. OAuth access tokens are still restricted by the API's client_id allowlist and server-side session epoch.
      responses:
        '200':
          description: Public OAuth configuration; no client secret is issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthClientConfiguration' }
              example:
                issuer: https://project-ref.supabase.co/auth/v1
                authorizationEndpoint: https://project-ref.supabase.co/auth/v1/oauth/authorize
                tokenExchangeEndpoint: https://track.srishanth.me/api/v1/auth/oauth/exchange
                refreshEndpoint: https://track.srishanth.me/api/v1/auth/refresh
                clientId: fixture-public-client-id
                redirectUri: https://track.srishanth.me/oauth/callback
                responseType: code
                codeChallengeMethod: S256
                scopes: [openid]
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/oauth/exchange:
    post:
      tags: [Auth]
      operationId: exchangeOAuthAuthorizationCode
      security: []
      summary: Exchange a PKCE authorization code and register its member session
      description: The Vercel API forwards the one-time code to Supabase, validates the returned access token and the fixed Android client_id, then registers the session only if its JWT iat is at or after the current account session epoch boundary. The code and verifier are never returned or logged.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OAuthCodeExchangeRequest' }
            example: { code: fixture-authorization-code-do-not-use, codeVerifier: fixture-code-verifier-do-not-use-abcdefghijklmnopqrstuvwxyz012345 }
      responses:
        '200':
          description: OAuth member session; temporary-password rotation remains required when indicated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberSession' }
              example:
                accessToken: fixture-oauth-access-token-do-not-use
                refreshToken: fixture-oauth-refresh-token-do-not-use
                tokenType: Bearer
                expiresInSeconds: 3600
                user: { id: 1bcb3a8e-0d22-4b0a-a910-510fd4547f61, username: aarav, mustRotatePassword: false }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the current refresh session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 20 }
      responses:
        '200':
          description: Current refresh session revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties: { revoked: { type: boolean, const: true } }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
  /me:
    get:
      tags: [Member]
      operationId: getCurrentMember
      summary: Read the caller's profile and current sharing epoch
      description: The initial sharingEpoch is 1. After a successful account-wide stop, the client must persist the returned epoch and use it for newly captured samples.
      responses:
        '200':
          description: Current member profile and account-wide sharing epoch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberProfile' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
        '428': { $ref: '#/components/responses/PasswordRotationRequired' }
  /me/password:
    post:
      tags: [Member]
      operationId: changePassword
      summary: Change the caller's password and invalidate other sessions
      description: Requires the current password. Successful change increments the server session epoch, revokes outstanding refresh sessions and requires a fresh login. No member data is returned by this operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1, writeOnly: true }
                newPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: Password changed; all previous sessions are invalidated
          content:
            application/json:
              schema:
                type: object
                required: [changed, sessionsRevoked, reauthenticationRequired]
                properties:
                  changed: { type: boolean, const: true }
                  sessionsRevoked: { type: boolean, const: true }
                  reauthenticationRequired: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
  /me/stop-sharing:
    post:
      tags: [Member]
      operationId: stopAllSharing
      summary: Stop the caller's location sharing and revoke every active guest link
      description: >-
        Idempotently advances the member sharing epoch, disables Circle sharing,
        ends active trips and revokes all active guest links in one server-side
        transaction. The initial epoch is 1. Replaying the same clientRequestId
        returns the original result and epoch without incrementing again.
        Android stops collection immediately and persists this
        idempotent command while offline; on reconnect it sends this command
        before any queued data. The server rejects queued fixes from older
        sharing epochs. A client must not upload old queued fixes after a stop.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [clientRequestId]
              properties:
                clientRequestId: { type: string, format: uuid }
      responses:
        '200':
          description: All server-side sharing state stopped
          content:
            application/json:
              schema:
                type: object
                required: [stopped, endedShareCount, sharingEpoch]
                properties:
                  stopped: { type: boolean, const: true }
                  endedShareCount: { type: integer, minimum: 0 }
                  sharingEpoch: { type: integer, minimum: 1 }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
        '428': { $ref: '#/components/responses/PasswordRotationRequired' }
  /locations/batch:
    post:
      tags: [Location]
      operationId: uploadLocationBatch
      summary: Upload bounded, replay-safe location samples
      description: >-
        Maximum 100 samples per request. sampleId is an idempotency key. Samples
        are validated for coordinate bounds, accuracy, clock skew and per-user
        ordering. Each request carries the current sharingEpoch from GET /me;
        mismatch rejects the entire batch with 409 and accepts no samples. The
        server rechecks the epoch transactionally to close a concurrent-stop
        race. The server derives the owner from the session; callers cannot
        choose another member. Samples older than a share's startedAt are never
        released through that share. A terminal share rejects samples captured
        after its accepted ending event.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationBatchRequest' }
            examples:
              syntheticRoute:
                value:
                  sharingEpoch: 1
                  samples:
                    - sampleId: 10c0f632-7ad5-4d4e-8ae4-f72e98e9678c
                      capturedAt: '2026-11-26T10:00:00Z'
                      latitude: 19.076
                      longitude: 72.8777
                      accuracyMeters: 12.5
                      speedMps: 8.4
      responses:
        '200':
          description: Per-sample accepted, duplicate, or rejected results
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationBatchResult' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
        '403':
          description: No enabled Circle sharing consent or active guest share permits location collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { error: { code: sharing_disabled, message: Enable sharing before uploading location samples } }
        '428': { $ref: '#/components/responses/PasswordRotationRequired' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '409':
          description: The supplied sharingEpoch is no longer current; no sample in the batch is accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              examples:
                epochMismatch:
                  value:
                    error:
                      code: SHARING_EPOCH_MISMATCH
                      message: Refresh the member profile and discard queued samples from an older sharing epoch.
                      requestId: 2c5a9f68-9bf3-45e3-8e0a-9f7efc9365a4
  /shares:
    get:
      tags: [Shares]
      operationId: listShares
      summary: List the caller's guest links without exposing their secrets
      description: The secret-bearing URL is returned only when a share is created. Lists never contain a secret, digest, or complete URL.
      responses:
        '200':
          description: Caller's shares and expiry state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareList' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
        '428': { $ref: '#/components/responses/PasswordRotationRequired' }
    post:
      tags: [Shares]
      operationId: createShare
      summary: Create a guest trip share
      description: >-
        Returns the complete secret-bearing link once. Persist only a digest of
        the 256-bit random secret. The URL fragment is not sent to the web
        server on initial navigation. For a drive_end share, `confirmedDrive`
        is an explicit member confirmation. If no active confirmed drive
        exists, true starts a private guest-only drive session; false or
        omission does not start one. A Circle drive can be reused only from
        the same member session and current sharing epoch. An active drive from
        another session, or a pre-upgrade active drive without recorded
        session and epoch, returns 409 and must be stopped and restarted on the
        current device before it can be shared.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateShareRequest' }
            examples:
              untilDriveEnd:
                value: { mode: drive_end, confirmedDrive: true }
              untilTime:
                value: { mode: time, expiresAt: '2026-11-26T12:00:00Z' }
              destination:
                value:
                  mode: destination
                  destination: { latitude: 19.076, longitude: 72.8777, radiusMeters: 150 }
      responses:
        '201':
          description: Share created; full URL is returned only here
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedShare' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
        '409':
          description: A drive_end share needs an active confirmed driver trip from the same session and sharing epoch, or confirmedDrive true when no active drive exists; a different or unbound active trip returns 409
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        '428': { $ref: '#/components/responses/PasswordRotationRequired' }
  /shares/{shareId}:
    parameters:
      - { $ref: '#/components/parameters/ShareId' }
    delete:
      tags: [Shares]
      operationId: revokeShare
      summary: Revoke a share idempotently
      responses:
        '200':
          description: Share is terminal and cannot be revived
          content:
            application/json:
              schema:
                type: object
                required: [revoked, endedAt]
                properties:
                  revoked: { type: boolean, const: true }
                  endedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /shares/{shareId}/events:
    parameters:
      - { $ref: '#/components/parameters/ShareId' }
    post:
      tags: [Shares]
      operationId: submitShareEvent
      summary: Submit bounded evidence for arrival or drive-end
      description: >-
        Offline clients submit the locally detected terminal event and its
        bounded evidence before uploading any later fixes. The server verifies
        evidence using the authenticated owner, timestamps, ordering, accuracy,
        and server-side thresholds. First confirmed ending wins. A parked start,
        GPS gap, poor accuracy, traffic stop, duplicate or late request cannot
        end or revive a share. Destination evidence must be captured after the
        share starts. Drive-end evidence must belong to the linked confirmed
        trip's member session and sharing epoch; its moving pair may predate the
        share start, while the full stationary end window must be post-share.
        Drive-end needs at least two credible moving fixes spanning 30 seconds
        and at least 150 metres; the last moving fix must be within 90 seconds
        of the first stationary fix. The stationary window must span five
        minutes, with no gap over 90 seconds, speeds at or below 1.5 m/s,
        accuracy at or below 50 metres, and all fixes within 75 metres of the
        first stationary fix.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ShareEventRequest' }
            examples:
              nineMinuteGap:
                summary: Nine-minute movement-to-stop gap stays pending
                externalValue: ./examples/share-event-drive-end.request.json
              validDriveEnd:
                summary: Sixty-second transition and five-minute stop confirms
                externalValue: ./examples/share-event-drive-end.confirmed.request.json
      responses:
        '200':
          description: Event accepted, pending more evidence, or duplicate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareEventResult' }
              examples:
                nineMinuteGapPending:
                  summary: Insufficient continuity keeps the link active
                  externalValue: ./examples/share-event-drive-end.pending.response.json
                driveEndConfirmed:
                  summary: Valid movement and stationary evidence ends the link
                  externalValue: ./examples/share-event-drive-end.confirmed.response.json
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/ShareEnded' }
  /public/shares/{shareId}:
    parameters:
      - { $ref: '#/components/parameters/ShareId' }
    get:
      tags: [Guest]
      operationId: readPublicShare
      security:
        - shareSecret: []
      summary: Read only the latest location for one active share
      description: >-
        The secret is read from the URL fragment by the browser and sent as
        Authorization: Bearer. A missing/invalid secret and unknown ID both
        return the same 404. Ended, expired, disabled-owner, or revoked shares
        return 410 without any location. Every response is Cache-Control:
        private, no-store and must not be logged with credentials or coordinates.
        Normal polling is about every 10 seconds. Successful reads grant at most
        30 seconds of display; clear cached coordinates when that window lapses.
        Data older than 90 seconds is returned as signal_lost with latest null.
      responses:
        '200':
          description: Current share state; latest is null while waiting or signal is lost
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicShare' }
              examples:
                waiting:
                  value:
                    status: waiting
                    serverTime: '2026-11-26T10:00:00Z'
                    viewValidUntil: '2026-11-26T10:00:30Z'
                    latest: null
                active:
                  value:
                    status: active
                    serverTime: '2026-11-26T10:00:10Z'
                    viewValidUntil: '2026-11-26T10:00:40Z'
                    latest:
                      latitude: 19.076
                      longitude: 72.8777
                      accuracyMeters: 12.5
                      capturedAt: '2026-11-26T10:00:08Z'
                      speedMps: 8.4
                signalLost:
                  value:
                    status: signal_lost
                    serverTime: '2026-11-26T10:02:00Z'
                    viewValidUntil: '2026-11-26T10:02:30Z'
                    latest: null
        '404':
          description: Unknown share or invalid/missing bearer secret; no location
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { error: { code: NOT_FOUND, message: Share not found } }
        '410':
          description: Valid share ended or expired; no location
          headers:
            Cache-Control: { schema: { type: string, const: 'private, no-store' } }
            Referrer-Policy: { schema: { type: string, const: no-referrer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
              example: { error: { code: SHARE_ENDED, message: Share is no longer active } }
  /circles:
    get:
      tags: [Circles]
      operationId: listCircles
      summary: List only Circles the caller belongs to
      responses:
        '200':
          description: Circles visible to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircleList' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
    post:
      tags: [Circles]
      operationId: createCircle
      summary: Create a private, invitation-only Circle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CircleInput' }
      responses:
        '201':
          description: Circle created with the caller as admin
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircleSummary' }
        '401': { $ref: '#/components/responses/GenericUnauthorized' }
  /circles/{circleId}:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [Circles]
      operationId: getCircle
      summary: Read a Circle after membership validation
      responses:
        '200':
          description: Circle details visible to an active member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircleSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Circles]
      operationId: updateCircle
      summary: Update Circle settings; only Circle admins may change admin-managed settings
      requestBody: { $ref: '#/components/requestBodies/CircleUpdate' }
      responses:
        '200':
          description: Updated Circle summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircleSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Circles]
      operationId: leaveCircle
      summary: Leave a Circle; removal and history access are enforced immediately
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/invites:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [Circles]
      operationId: listCircleInvites
      summary: List active invites for Circle admins
      responses:
        '200':
          description: Active invite metadata without bearer tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircleInviteList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Circles]
      operationId: createCircleInvite
      summary: Create a one-time invitation link for an existing provisioned account
      description: The one-time token is returned only inside the URL fragment of this response; only its digest is stored. The URL is https://track.srishanth.me/i#{inviteToken}. Tokens expire within 72 hours and cannot create platform accounts. Replaying a clientRequestId returns a conflict because the one-time token cannot be recovered.
      requestBody: { $ref: '#/components/requestBodies/CircleInviteCreate' }
      responses:
        '201':
          description: Invitation created; share the one-time URL only with the intended member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircleInviteCreated' }
        '409': { $ref: '#/components/responses/Conflict' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circle-invites/accept:
    post:
      tags: [Circles]
      operationId: acceptCircleInvite
      summary: Accept an invitation as the authenticated, already provisioned member
      description: Read the token from https://track.srishanth.me/i#{inviteToken} and send it only in this authenticated request body, never in the initial browser request or an API URL. Android App Links should route /i to the app after release signing verification; a browser fallback may show the accept-in-app handoff.
      requestBody: { $ref: '#/components/requestBodies/CircleInviteAccept' }
      responses:
        '200':
          description: Circle membership accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircleInviteAcceptResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /circles/{circleId}/members:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [Circles]
      operationId: listCircleMembers
      summary: List members only for an active Circle member
      responses:
        '200':
          description: Active Circle members and their current Circle consent state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircleMemberList' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/members/{memberId}:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
      - { $ref: '#/components/parameters/MemberId' }
    patch:
      tags: [Circles]
      operationId: updateCircleMember
      summary: Update a Circle role or the caller's own location precision
      description: Circle admins may change another member's role. A member may change only their own precision. Sharing and activity consent must be changed by the member through the dedicated consent routes.
      requestBody: { $ref: '#/components/requestBodies/CircleMemberUpdate' }
      responses:
        '200':
          description: Current Circle membership state after the permitted update
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircleMemberUpdateResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Circles]
      operationId: removeCircleMember
      summary: Remove a member from this Circle; only its admins may remove others
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/map:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [Circles]
      operationId: getCircleMap
      summary: Read latest consenting Circle locations with Bubble precision enforced
      description: Requires active membership and each member's current sharing consent. A Bubble result is approximate and precise coordinates are not exposed through another route.
      responses:
        '200':
          description: Current consenting Circle members; location precision is resolved before serialization
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircleMap' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/history:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [Circles]
      operationId: getCircleHistory
      summary: Read bounded Circle history under current membership and precision policy
      parameters:
        - { name: memberId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: to, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 1000, default: 500 } }
      responses:
        '200':
          description: Bounded historical route data allowed by current membership and precision rules
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationHistory' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/sharing:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    put:
      tags: [Circles]
      operationId: setCircleSharing
      summary: Pause or resume the caller's location sharing for this Circle
      description: Changes only this member's sharing consent in the specified Circle. It does not stop or advance account-wide sharing and does not revive any revoked guest link; use POST /me/stop-sharing for the global stop.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CircleSharingRequest' }
            examples:
              pause:
                value: { sharingEnabled: false }
              resume:
                value: { sharingEnabled: true }
      responses:
        '200':
          description: Updated caller sharing consent in this Circle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CircleSharingResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/bubbles:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [Circles]
      operationId: listBubbles
      summary: Read active Circle Bubbles without revealing hidden precise positions
      responses:
        '200':
          description: Active approximate Bubble records in this Circle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BubbleList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Circles]
      operationId: createBubble
      summary: Create a time-limited approximate-location Bubble
      description: Bubble duration is at most six hours. Radius and returned coordinates are approximate. Emergency and member burst events can end it.
      requestBody: { $ref: '#/components/requestBodies/BubbleCreate' }
      responses:
        '201':
          description: Bubble created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bubble' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/bubbles/{bubbleId}:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
      - { name: bubbleId, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [Circles]
      operationId: endBubble
      summary: End or burst an active Bubble
      responses:
        '200':
          description: Bubble ended or an already-ended Bubble's terminal result replayed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BubbleEndResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/places:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [Places]
      operationId: listPlaces
      summary: List Places visible to this Circle
      responses:
        '200':
          description: Places for this Circle; destination coordinates are private Circle data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Places]
      operationId: createPlace
      summary: Create a named, private Circle Place
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceInput' }
      responses:
        '201':
          description: Place created in the Circle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/places/{placeId}:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
      - { name: placeId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Places]
      operationId: updatePlace
      summary: Update a Circle Place or its geofence radius
      requestBody: { $ref: '#/components/requestBodies/PlaceUpdate' }
      responses:
        '200':
          description: Updated Place
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Places]
      operationId: deletePlace
      summary: Delete a Circle Place
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/places/{placeId}/rules:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
      - { name: placeId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Places]
      operationId: listPlaceRules
      summary: List geofence and No Show rules for a Place
      responses:
        '200':
          description: Rules attached to this Place
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceRuleList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Places]
      operationId: createPlaceRule
      summary: Create arrival, departure, one-time, or recurring No Show rules
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceRuleInput' }
            example:
              kind: no_show
              expectedAt: '2026-11-26T15:00:00Z'
              graceMinutes: 15
              recurrence: null
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceRule' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/places/{placeId}/rules/{ruleId}:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
      - { name: placeId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: ruleId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Places]
      operationId: updatePlaceRule
      summary: Update a geofence or No Show rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceRuleInput' }
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaceRule' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Places]
      operationId: deletePlaceRule
      summary: Delete a geofence or No Show rule
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/checkins:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
    get:
      tags: [Coordination]
      operationId: listCheckins
      summary: List Circle check-ins under current membership
      responses:
        '200':
          description: Recent check-ins visible to this Circle member
          content:
