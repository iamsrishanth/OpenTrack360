  /circles/{circleId}/sos/{sosId}/acknowledge:
    parameters:
      - { $ref: '#/components/parameters/CircleId' }
      - { name: sosId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Safety]
      operationId: acknowledgeSosAlert
      summary: Record an authenticated recipient acknowledgement
      responses:
        '200': { $ref: '#/components/responses/MutationResult' }
