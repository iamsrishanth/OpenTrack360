    post:
      tags: [Coordination]
      operationId: createQuickNote
      summary: Send a bounded Quick Note to this Circle
      requestBody: { $ref: '#/components/requestBodies/QuickNoteCreate' }
      responses:
        '201':
          description: Quick Note accepted for the addressed Circle
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuickNote' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /circles/{circleId}/events:
    parameters:
