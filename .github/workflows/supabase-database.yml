name: Supabase database tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - "contracts/examples/**"
      - "scripts/generate-drive-end-pgtap.mjs"
      - ".github/workflows/supabase-database.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "contracts/examples/**"
      - "scripts/generate-drive-end-pgtap.mjs"
      - ".github/workflows/supabase-database.yml"

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Generate drive-end tests from contract fixtures
        run: node scripts/generate-drive-end-pgtap.mjs

      - name: Verify generated drive-end tests are committed
        run: git diff --exit-code -- supabase/tests/drive_end_contract_examples.sql

      - name: Start isolated local Supabase stack
        run: supabase start

      - name: Apply migrations to a clean local database
        run: supabase db reset

      - name: Run database pgTAP suite
        run: supabase test db
