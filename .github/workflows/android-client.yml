name: Android client checks

on:
  pull_request:
    paths:
      - "apps/android/**"
      - "contracts/openapi.yaml"
      - "contracts/examples/**"
      - ".github/workflows/android-client.yml"
  push:
    branches:
      - main
      - android/implementation
    paths:
      - "apps/android/**"
      - "contracts/openapi.yaml"
      - "contracts/examples/**"
      - ".github/workflows/android-client.yml"

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-client:
    name: Unit tests, debug APK, and release lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install compile and lint SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Run Android checks
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:lintVitalRelease
